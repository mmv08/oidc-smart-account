[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "prague"
optimizer = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
# These lints flag code that is correct here: time comparisons, reverts in parser loops, zero
# addresses that stop updates or remove the signer, and an event after `ecrecover`.
exclude_lints = ["block-timestamp", "require-revert-in-loop", "missing-zero-check", "reentrancy-events"]
