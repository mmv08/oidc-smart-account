[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 100000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fuzz = { runs = 2048 }
invariant = { runs = 512, depth = 64, fail_on_revert = false }
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 2000, depth = 128, fail_on_revert = false }
