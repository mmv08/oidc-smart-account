[package]
name = "tee-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
default-run = "tee-updater"
license = "MIT"
description = "AWS Nitro Enclave app that signs the JWKS of an OIDC issuer for the JWKSRegistry contract"

[dependencies]
alloy-primitives = { version = "1.7.3", features = ["serde"] }
alloy-sol-types = "1.7.3"
anyhow = "1.0.104"
aws-nitro-enclaves-nsm-api = "0.5.2"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
coset = { version = "0.3.8", features = ["std"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
nitro_attest = "0.2.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
time = "0.3.55"
vsock = "0.5.4"
webpki-roots = "1.0.9"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
