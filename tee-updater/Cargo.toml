[package]
name = "tee-google-key-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Measured AWS Nitro Enclave updater for Google OIDC signing keys"

[features]
default = []
nitro = ["dep:aws-nitro-enclaves-nsm-api", "dep:serde_cbor", "dep:serde_bytes"]
verifier = ["dep:nitro_attest", "dep:time"]

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0.17"
zeroize = { version = "1.8.2", features = ["serde"] }
vsock = "0.5.2"
nitro_attest = { version = "0.2.0", optional = true }
time = { version = "0.3.44", optional = true }
aws-nitro-enclaves-nsm-api = { version = "0.4.0", optional = true }
serde_cbor = { version = "0.11.2", optional = true }
serde_bytes = { version = "0.11.19", optional = true }

[[bin]]
name = "verify-enrollment"
path = "src/bin/verify-enrollment.rs"
required-features = ["verifier"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
