[package]
name = "tee-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "tee-updater"
license = "MIT"
description = "AWS Nitro Enclave app that signs the JWKS of an OIDC issuer for the JWKSRegistry contract"

[dependencies]
anyhow = "1.0.100"
aws-nitro-enclaves-nsm-api = "0.4.0"
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa"] }
nitro_attest = "0.2.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_cbor = "0.11.2"
serde_json = "1.0.145"
sha3 = "0.10.8"
time = "0.3.44"
vsock = "0.5.2"
webpki-roots = "1.0.4"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
